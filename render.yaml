services:
  # 1. FastAPI AI Service
  - type: web
    name: aicodebase-ai-service
    env: python
    region: oregon
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: aicodebase-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aicodebase-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aicodebase-redis
          property: port

  # 2. React Frontend Static Site
  - type: web
    name: aicodebase-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Database
  - name: aicodebase-db
    databaseName: aicodebase
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: 16
