services:
  # ============================================================================
  # 1. Spring Boot Java 21 Backend Service
  # ============================================================================
  - type: web
    name: aicodebase-backend
    env: docker
    region: oregon
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: aicodebase-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aicodebase-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aicodebase-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: aicodebase-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aicodebase-db
          property: password
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: aicodebase-ai-service
          property: host
      - key: FRONTEND_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

  # ============================================================================
  # 2. FastAPI Python AI & Tree-Sitter Microservice
  # ============================================================================
  - type: web
    name: aicodebase-ai-service
    env: docker
    region: oregon
    plan: free
    rootDir: ai-service
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: aicodebase-db
          property: connectionString

  # ============================================================================
  # 3. React Vite Frontend Static Site (Global CDN)
  # ============================================================================
  - type: web
    name: aicodebase-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aicodebase-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================================================
# 4. Managed PostgreSQL 16 Database
# ==============================================================================
databases:
  - name: aicodebase-db
    databaseName: aicodebase
    user: aicodebase_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
