services:
  # ============================================================================
  # 1. Spring Boot Java 21 Backend Service
  # ============================================================================
  - type: web
    name: aicodebase-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: BACKEND_PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: aicodebase-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: aicodebase-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: aicodebase-db
          property: password
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: aicodebase-ai-service
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: aicodebase-frontend
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000

  # ============================================================================
  # 2. FastAPI Python AI & Tree-Sitter Microservice
  # ============================================================================
  - type: web
    name: aicodebase-ai-service
    env: docker
    region: oregon
    plan: free
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: aicodebase-db
          property: connectionString
      # Note: Add your LLM keys in the Render Dashboard Environment settings:
      # - GEMINI_API_KEY
      # - OPENAI_API_KEY
      # - ANTHROPIC_API_KEY
      # - GROQ_API_KEY

  # ============================================================================
  # 3. React Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: aicodebase-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aicodebase-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ==============================================================================
# 4. Managed PostgreSQL 16 Database
# ==============================================================================
databases:
  - name: aicodebase-db
    databaseName: aicodebase
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: 16
